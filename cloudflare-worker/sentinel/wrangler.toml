# wrangler.toml — boatrace-sentinel（本体 Worker の外形監視・自己復旧）
#
# 2026-11-11: GitHub Actions の schedule は本リポジトリで 1 workflow あたり 1-2 回/日まで
#   間引かれており、worker-watchdog.yml（毎時宣言）も data-freshness-monitor.yml（5 分宣言）も
#   監視として機能していなかった（実測 11/8-11/11）。本体 Worker の cron 停止は 9/21-10/17 に
#   15 回発生しており、検知の空白は数時間〜半日になる。
#   → 監視そのものを Cloudflare の cron に載せる。Cloudflare の Cron Triggers は間引かれない。
#
# 本体 (boatrace-scrape-trigger) と同じ KV namespace を共用する（キー `sentinel:state`）。
#   KV namespace は複数 Worker にバインドでき、新規作成の手作業が要らない。
#   書込は平常時 24 回/日（sentinel 自身の cron の生存記録、1 時間に 1 回）。失敗区間がある日でも
#   1 日 120 回 + 必須の保存に抑える（sentinel.js の DAILY_WRITE_BUDGET）。
#
# 手動設定（secret）は不要。デプロイと検証は .github/workflows/deploy-worker.yml が行う。
#   BUILD_ID はデプロイ時に `--var BUILD_ID:<sha>.<run_id>.<attempt>` で注入される（ここには書かない）。
#   sentinel は BUILD_ID が変わった最初の cron tick を即 KV に記録するので、deploy-worker.yml の
#   verify-sentinel-cron job が「新バージョンの cron が実際に発火した」ことを確認できる。
#
# 任意の secret（Cloudflare dashboard → Workers & Pages → boatrace-sentinel → Settings →
#   Variables and Secrets。`wrangler deploy` しても保持される）:
#   GH_TOKEN        — GitHub fine-grained PAT（このリポジトリに Actions: Read and write,
#                     Issues: Read and write）。入れると本体 cron 停止時の再デプロイと issue 起票を
#                     sentinel が 15 分で行う。無い場合は worker-watchdog.yml（組込みトークン）が
#                     代行する（最大 1 日程度）。どちらの場合もデータは refresh-now で更新され続ける。
#   TRIGGER_SECRET  — 本体と同じ値。提示すると refresh-now の 5 分 throttle を素通りする。
#                     無い場合、sentinel は 429 の残りが 30 秒以内なら待って 1 回再試行する。

name = "boatrace-sentinel"
main = "sentinel.js"
compatibility_date = "2024-12-01"

[triggers]
# 5 分毎・終日。本体の夜間 cron は 30 分間隔なので閾値側（NIGHT）で吸収する。
# Cloudflare Free は Cron Triggers 合計 5/アカウント: 本体 2 + sentinel 1 = 3。
crons = ["*/5 * * * *"]

[vars]
MAIN_BASE = "https://boatrace-scrape-trigger.inotaka1979.workers.dev"
GH_REPO = "inotaka1979/boatrace-ai"
DEPLOY_WORKFLOW = "deploy-worker.yml"
ISSUE_LABEL = "worker-cron-dead"
# 連続何回 strict 失敗で「障害」と判定するか（5 分 × 3 = 15 分）
FAIL_THRESHOLD = "3"
# 再デプロイ dispatch の最小間隔（秒）。再デプロイで直らない故障で連打しない。
REDEPLOY_COOLDOWN_SEC = "10800"
# 障害継続中に issue へ経過コメントを追記する間隔（秒）
ISSUE_COMMENT_INTERVAL_SEC = "3600"

[[kv_namespaces]]
binding = "BOATRACE_KV"
id = "7834740f2f034a04a54b9bde4078d717"

# 2026-11-11: 本体 Worker への Service Binding。
#   Worker から同一アカウントの *.workers.dev を公開 URL で fetch すると Cloudflare が
#   404 を返す (Worker→Worker の同一ゾーン fetch 非対応、error 1042)。初回デプロイの
#   /status で main_probe.http=404 として実測。Service Binding なら直接呼べる (無料、
#   サブリクエスト数にも乗らない)。MAIN_BASE は URL の path/query の組立てにだけ使う。
[[services]]
binding = "MAIN"
service = "boatrace-scrape-trigger"
