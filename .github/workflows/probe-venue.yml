name: Probe Venue (diag)
# 2026-11-11: push トリガーを撤去し workflow_dispatch のみに。
#   旧設定は「この workflow ファイル自身 / probe スクリプトの変更」で発火したため、
#   .gitignore 対応の編集 (#324) が merge された直後に自ら走り、削除したばかりの
#   data/_debug/ サンプルを再コミットした (fbeefef2a)。診断は手動実行だけで十分。
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: probe-venue
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/probe_venue.py
      - name: Commit samples
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          git config user.name "Automated"; git config user.email "actions@users.noreply.github.com"
          git add -f data/_debug/   # 2026-11-11: .gitignore 対象。診断時のみ一時 commit し、確認後に撤去
          if git diff --staged --quiet; then echo "no samples"; exit 0; fi
          git commit -m "probe: venue samples $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3 4 5; do
            git fetch "$REMOTE" main
            if git rebase FETCH_HEAD; then git push "$REMOTE" HEAD:main && exit 0; else git rebase --abort||true; fi
            sleep $((RANDOM%5+i))
          done
          echo "::error::push failed"; exit 1
