name: E2E (Playwright)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'manifest.json'
      - 'src/**'
      - 'tests/e2e/**'
      - 'build/playwright.config.mjs'
      - 'build/package.json'
      - 'scripts/vrt_request.sh'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'manifest.json'
      - 'src/**'
      - 'tests/e2e/**'
      - 'build/playwright.config.mjs'
      - 'build/package.json'
      - 'scripts/vrt_request.sh'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # L1: WebKit smoke — iOS Safari エンジンで critical flow を毎 PR で検証
  # FIX: テスト infrastructure が JS-load 状態の baseline と整合していないため、
  #   現状は advisory（fail でも PR を block しない）。実バグは下流で検出される。
  #   baseline 整備後に continue-on-error を外す。
  smoke:
    # Playwright 1.63.0 は ubuntu 26.04 (= ubuntu-latest) に対応（1.59.1 は非対応で 24.04 に固定していた）。
    runs-on: ubuntu-latest
    # apt ミラーが遅い日 (2026-11-19 実測 ~117kB/s) は WebKit の依存取得だけで 10 分を超え、
    #   テスト前に cancel された。install に余裕を持たせる。
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: build/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright + WebKit
        working-directory: build
        run: |
          npm ci --no-audit --no-fund
          # Ubuntu の apt ミラーが一時的に 503 を返すことがある (2026-11-19 実測) ため、
          #   失敗したら 60 秒待って最大 3 回まで試す。
          for i in 1 2 3; do
            npx playwright install --with-deps webkit && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "::warning::playwright install failed (attempt $i), retrying in 60s"
            sleep 60
          done
      # FIX: tests/e2e/*.mjs が `@playwright/test` を import するが、deps は build/node_modules
      # にある。Node ESM resolution は test ファイルから上方向に node_modules を探すため、
      # repo root から resolve できる経路を張る。
      # FA-8: root node_modules ごとの symlink はローカルの `npm ci` と衝突するため、
      #   ローカルと同一のスクリプト (@playwright スコープのみ symlink) に統一。
      - name: Link @playwright for ESM resolution
        run: bash scripts/ensure_e2e_deps.sh
      - name: Run WebKit smoke tests
        working-directory: build
        env:
          CI: '1'
        run: npx playwright test --config playwright.config.mjs --project=webkit-smoke
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report
          path: build/playwright-report
          retention-days: 7

  # VRT: Chromium snapshot — 10 画面の見た目退行を検出
  #
  # ⚠ FA-9 (2026-08-11) 現状: baseline の最終再生成は 88460479 (2026-05-10)。
  #   以降に入った意図的な UI 変更（2026-07-22 の #racesViewToggle 追加で
  #   #pageRaces が 140px → 190px、Epic 22/25 の i18n による nav ラベル変更）を
  #   baseline に反映していないため、**main を含む全 run で同じ 2 件が fail し続けて
  #   いる**（`nav: 5ボタン bottom navigation` / `races page: レース一覧 page wrapper
  #   layout`）。恒常的に赤いので、本物の見た目退行が混ざっても誰も気付けない
  #   ＝ VRT が 3 ヶ月間ゲートとして機能していない状態。
  #
  #   復旧手順: Actions タブ → 「E2E (Playwright)」→ Run workflow (workflow_dispatch)
  #   で下の update-snapshots ジョブを main に対して実行する。baseline が
  #   自動 commit され、以降は本物の退行だけが赤くなる。
  #
  # 2026-11-25: 意図した見た目の変更は tests/e2e/vrt-baseline-request で申告する。
  #   そのファイルを変更した PR / main への push では、申告されたテストだけ比較せず撮り直し
  #   （それ以外は通常どおり比較）、マージ後は update-snapshots が baseline を自動で差し替える。
  #   「マージ後に手動で Run workflow」を忘れて main が赤いまま残るのを防ぐ（docs/RUNBOOK.md §10）。
  vrt:
    # Playwright 1.63.0 は ubuntu 26.04 (= ubuntu-latest) に対応（1.59.1 は非対応で 24.04 に固定していた）。
    runs-on: ubuntu-latest
    # apt ミラーが遅い日 (2026-11-19 実測 ~117kB/s) は WebKit の依存取得だけで 10 分を超え、
    #   テスト前に cancel された。install に余裕を持たせる。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # scripts/vrt_request.sh が PR の変更ファイルを見る（merge commit の第 1 親 = base）
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: build/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium
        working-directory: build
        run: |
          npm ci --no-audit --no-fund
          # Ubuntu の apt ミラーが一時的に 503 を返すことがある (2026-11-19 実測) ため、
          #   失敗したら 60 秒待って最大 3 回まで試す。
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "::warning::playwright install failed (attempt $i), retrying in 60s"
            sleep 60
          done
      # FIX: tests/e2e/*.mjs が `@playwright/test` を import するが、deps は build/node_modules
      # にある。Node ESM resolution は test ファイルから上方向に node_modules を探すため、
      # repo root から resolve できる経路を張る。
      # FA-8: root node_modules ごとの symlink はローカルの `npm ci` と衝突するため、
      #   ローカルと同一のスクリプト (@playwright スコープのみ symlink) に統一。
      - name: Link @playwright for ESM resolution
        run: bash scripts/ensure_e2e_deps.sh
      - name: Detect intentional UI changes (tests/e2e/vrt-baseline-request)
        id: req
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          PATTERN=$(bash scripts/vrt_request.sh "$EVENT" "$BEFORE")
          echo "pattern=$PATTERN" >> "$GITHUB_OUTPUT"
          if [ -n "$PATTERN" ]; then
            echo "::notice::意図した見た目の変更として撮り直す VRT テスト: $PATTERN（それ以外は通常どおり比較）"
          fi
      - name: Run VRT
        working-directory: build
        env:
          CI: '1'
          PATTERN: ${{ steps.req.outputs.pattern }}
        run: |
          if [ -z "$PATTERN" ]; then
            npx playwright test --config playwright.config.mjs --project=chromium-vrt
          else
            # 申告されていないテストは通常どおり比較する（ここで落ちたら本物の退行）
            npx playwright test --config playwright.config.mjs --project=chromium-vrt --grep-invert "$PATTERN"
            # 申告されたテストは比較せず撮り直す（撮影できることだけ確かめる）。
            #   main の baseline は、マージ後に update-snapshots ジョブが差し替える。
            npx playwright test --config playwright.config.mjs --project=chromium-vrt --grep "$PATTERN" --update-snapshots
          fi
      - name: Upload regenerated snapshots (for review)
        if: steps.req.outputs.pattern != ''
        uses: actions/upload-artifact@v7
        with:
          name: vrt-regenerated-snapshots
          path: tests/e2e/screens.vrt.spec.mjs-snapshots
          retention-days: 7
      # FA-9: 失敗時に「stale baseline なのか本物の退行なのか」を判断する手順を
      #   ログ上で必ず示す。3 ヶ月間 stale のまま誰も再生成しなかった主因は、
      #   失敗ログから復旧手順に辿り着けなかったこと。
      - name: How to fix (baseline regeneration)
        if: failure()
        run: |
          echo "::warning::VRT が fail しました。差分画像は artifact 'playwright-vrt-report' を参照。"
          echo "意図した UI 変更なら、変わるのが正しいテストのタイトルを tests/e2e/vrt-baseline-request に"
          echo "書いて PR に含めてください（その PR では比較せず撮り直し、マージ後に baseline が自動で差し替わります）。"
          echo "身に覚えのない差分なら本物の退行です。手順: docs/RUNBOOK.md §10"
      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-vrt-report
          path: build/playwright-report
          retention-days: 7

  # FIX: VRT baseline 再生成専用ジョブ。Actions タブから手動 dispatch で
  #   実行し、生成された snapshot を main に commit して baseline を更新する。
  #   これを使ったあとに smoke + vrt の continue-on-error を外す。
  update-snapshots:
    # 手動実行（全スナップショット）、または main への push（tests/e2e/vrt-baseline-request が
    #   変更されていたときだけ、申告されたスナップショットを撮り直す。2026-11-25）
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Playwright 1.63.0 は ubuntu 26.04 (= ubuntu-latest) に対応（1.59.1 は非対応で 24.04 に固定していた）。
    runs-on: ubuntu-latest
    # apt ミラーが遅い日 (2026-11-19 実測 ~117kB/s) は WebKit の依存取得だけで 10 分を超え、
    #   テスト前に cancel された。install に余裕を持たせる。
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 2
      - name: Decide what to regenerate
        id: req
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "pattern=" >> "$GITHUB_OUTPUT"
            echo "手動実行: 全スナップショットを撮り直します"
            exit 0
          fi
          PATTERN=$(bash scripts/vrt_request.sh "$EVENT" "$BEFORE")
          echo "pattern=$PATTERN" >> "$GITHUB_OUTPUT"
          if [ -n "$PATTERN" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/e2e/vrt-baseline-request の申告に従って baseline を撮り直します: $PATTERN"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "申告なし（tests/e2e/vrt-baseline-request は変更されていません）: baseline はそのままです"
          fi
      - uses: actions/setup-node@v7
        if: steps.req.outputs.run == '1'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: build/package-lock.json
      - uses: actions/setup-python@v7
        if: steps.req.outputs.run == '1'
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium + WebKit
        if: steps.req.outputs.run == '1'
        working-directory: build
        run: |
          npm ci --no-audit --no-fund
          # Ubuntu の apt ミラーが一時的に 503 を返すことがある (2026-11-19 実測) ため、
          #   失敗したら 60 秒待って最大 3 回まで試す。
          for i in 1 2 3; do
            npx playwright install --with-deps chromium webkit && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "::warning::playwright install failed (attempt $i), retrying in 60s"
            sleep 60
          done
      - name: Link @playwright for ESM resolution
        if: steps.req.outputs.run == '1'
        run: bash scripts/ensure_e2e_deps.sh
      - name: Regenerate VRT baselines
        if: steps.req.outputs.run == '1'
        working-directory: build
        env:
          CI: '1'
          PATTERN: ${{ steps.req.outputs.pattern }}
        run: |
          if [ -n "$PATTERN" ]; then
            npx playwright test --config playwright.config.mjs --project=chromium-vrt --grep "$PATTERN" --update-snapshots
          else
            npx playwright test --config playwright.config.mjs --project=chromium-vrt --update-snapshots
          fi
      - name: Commit & Push regenerated baselines
        if: steps.req.outputs.run == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/screens.vrt.spec.mjs-snapshots/ || true
          if git diff --staged --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "vrt: regenerate snapshots ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # FIX: cron previews commits との race condition で push が rejected される
          # ことが多いため、失敗時は pull --rebase で取込んでから再 push する。
          # 他 scraper workflow と同じパターン。
          for i in 1 2 3; do
            if git push "$REMOTE" HEAD:${{ github.ref_name }}; then
              echo "push succeeded (attempt $i)"
              exit 0
            fi
            echo "push rejected (attempt $i) — pulling and retrying..."
            git pull --rebase "$REMOTE" ${{ github.ref_name }} || exit 1
          done
          echo "push failed after 3 attempts"
          exit 1
