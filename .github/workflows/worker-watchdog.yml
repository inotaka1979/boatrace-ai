name: Worker Watchdog (self-heal)

# rt-fix3 P2-1 (2026-06-27): Cloudflare Worker の死活を叩き、KV が stale (cron 死亡の兆候)
#   なら /api/refresh-now を呼んで KV 再生成を促す能動的セルフヒール（backstop）。
#
# 2026-09-06: cron 死亡 (reason=cron_heartbeat_stale / _missing) を検知したら、
#   RUNBOOK §8.3-3 の手順どおり deploy-worker.yml を dispatch して cron trigger を
#   再登録する（refresh-now はデータを更新するだけで cron は復活しないため）。
#   併せて issue (label: worker-cron-dead) で検知/復旧を可視化する。
#   実障害: 9/5 22:36 JST に cron が停止し、翌朝まで誰も気付けなかった。
#
#   注意: GitHub schedule は本リポジトリで 1 workflow あたり 4-6 回/日に間引かれるため、
#   これは「保険」であり主系ではない。Worker 側は /api/* サーブ時に heartbeat stale を
#   検知すると自前で refreshAll を回す (serve-heal) ので、cron 死亡中もデータ鮮度は保たれる。
#
# 2026-11-11: 実測で本 workflow は 1-2 回/日しか発火していなかった（11/8-11/11）。
#   分単位の監視・自己復旧は Cloudflare 側の第 2 Worker **boatrace-sentinel**
#   (cloudflare-worker/sentinel/, 5 分 cron, 間引きなし) に移した。本 workflow は
#   sentinel 自身が止まった場合の最後の保険として残す (docs/RUNBOOK.md §8.2)。
#
#   役割分担 (手動設定の secret は不要):
#     sentinel (5 分毎)  … 本体 cron 停止を検知し、refresh-now を 5 分毎に叩く「予備の cron」になる
#     本 workflow (≦1 日) … 組込み GITHUB_TOKEN で (a) 本体 cron の再登録 = 再デプロイ、
#                          (b) issue による記録、(c) sentinel 自身の死活確認 (監視役の監視)

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0-13 * * *'    # JST 9-22 帯に毎時 1 回程度（実際は間引かれる）

permissions:
  contents: read
  actions: write   # 2026-09-06: cron 死亡時に deploy-worker.yml を dispatch して cron を再登録
  issues: write    # 2026-09-06: 検知 / 復旧を issue で可視化

concurrency:
  group: worker-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /health and self-heal
        env:
          # FA-5: /api/refresh-now は未認証だと 5 分に 1 回へ throttle される。
          #   watchdog は「stale を検知した今すぐ」再生成させたいので secret を提示する。
          #   未設定でも動作する（throttle に当たれば 429 → 次回 run で再試行）。
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BASE="https://boatrace-scrape-trigger.inotaka1979.workers.dev"
          # strict=1 は cron ハートビート (cron_age_sec) で判定。夜間 cron は 30 分間隔のため
          # 余裕を見て 2400s(40分)。これより古い = cron 停止の兆候。
          HEALTH="$BASE/health?strict=1&max_age_sec=2400"
          LABEL="worker-cron-dead"

          probe() {
            curl -sS -m 15 -o /tmp/health.json -w "%{http_code}" "$HEALTH" || echo "000"
          }
          health_reason() {
            python3 -c 'import json; print(json.load(open("/tmp/health.json")).get("reason",""))' 2>/dev/null || echo ""
          }
          # 復旧時: 開いている検知 issue を閉じる (冪等)
          close_issue_if_open() {
            local n
            n=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")
            if [ -n "$n" ]; then
              gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
                --body "✅ $(date -u +%Y-%m-%dT%H:%MZ) watchdog: /health?strict=1 が 200 に復旧しました（cron heartbeat 再開）。自動クローズします。" >/dev/null 2>&1 || true
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
              echo "closed issue #$n"
            fi
          }

          status=$(probe)
          echo "health status: $status"
          cat /tmp/health.json 2>/dev/null || true
          echo ""

          if [ "$status" = "200" ]; then
            echo "✅ Worker KV is fresh — nothing to do"
            close_issue_if_open
            exit 0
          fi

          echo "⚠️ Worker stale/down (HTTP $status) — triggering /api/refresh-now"
          rn=$(curl -sS -m 60 -o /tmp/refresh.json -w "%{http_code}" \
                 -H "x-trigger-secret: ${TRIGGER_SECRET:-}" \
                 "$BASE/api/refresh-now" || echo "000")
          echo "refresh-now status: $rn"
          if [ "$rn" = "429" ]; then
            echo "::warning::refresh-now が throttle された（TRIGGER_SECRET 未設定 or 直近 5 分に実行済）"
          fi
          head -c 500 /tmp/refresh.json 2>/dev/null || true
          echo ""

          # 再生成後に Cloudflare が反映するまで少し待ってから再 probe
          sleep 10
          status2=$(probe)
          echo "health status after refresh: $status2"
          cat /tmp/health.json 2>/dev/null || true
          echo ""

          if [ "$status2" = "200" ]; then
            echo "✅ recovered via /api/refresh-now"
            close_issue_if_open
            exit 0
          fi

          reason=$(health_reason)
          echo "reason: ${reason:-<none>}"
          action="なし"

          # cron だけが死んでいる (Worker は応答する) → 再デプロイで cron trigger を再登録 (RUNBOOK §8.3-3)。
          #   refresh-now が 200/429 = HTTP ハンドラは生きている。000/5xx なら Worker 全体停止で再デプロイ対象外。
          if { [ "$reason" = "cron_heartbeat_stale" ] || [ "$reason" = "cron_heartbeat_missing" ]; } \
             && { [ "$rn" = "200" ] || [ "$rn" = "429" ]; }; then
            last=$(gh run list --workflow deploy-worker.yml --limit 1 --json createdAt --jq '.[0].createdAt' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")
            recent=0
            if [ -n "$last" ]; then
              recent=$(python3 - "$last" <<'PY'
          import datetime, sys
          t = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          print(1 if (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() < 3 * 3600 else 0)
          PY
              )
            fi
            if [ "$recent" = "1" ]; then
              action="再デプロイ見送り（deploy-worker が 3 時間以内に実行済: $last。再デプロイでは復旧しない可能性が高く、Cloudflare ダッシュボードの確認が必要）"
              echo "::warning::$action"
            else
              if gh workflow run deploy-worker.yml --ref main --repo "$GITHUB_REPOSITORY"; then
                action="deploy-worker.yml を dispatch（cron trigger の再登録。数分後の次回 watchdog / /health で回復を確認）"
                echo "::notice::$action"
              else
                action="deploy-worker.yml の dispatch に失敗（Actions 権限 / 同時実行を確認）"
                echo "::warning::$action"
              fi
            fi
          fi

          # 検知を issue で可視化（冪等: 既存の open issue があればコメント追記）
          gh label create "$LABEL" --color d93f0b --description "Cloudflare Worker の cron が停止" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          hb=$(python3 -c 'import json; d=json.load(open("/tmp/health.json")); print(d.get("cron_heartbeat"), d.get("cron_age_sec"))' 2>/dev/null || echo "?")
          body="$(cat <<EOF
          ## Cloudflare Worker cron 停止を検知

          - 検知時刻: $(date -u +%Y-%m-%dT%H:%MZ) UTC
          - /health?strict=1: HTTP $status → refresh-now $rn → 再 probe HTTP $status2
          - reason: \`${reason:-<none>}\`
          - cron_heartbeat / age_sec: \`$hb\`
          - 自動対処: $action

          ### 意味
          Worker 自体は応答しています。データは Worker の serve-heal（/api/* アクセス時に refreshAll を 5 分 throttle で自走）と
          この watchdog の refresh-now で更新されますが、\`scheduled()\` が動いていないため cron heartbeat が止まっています。

          ### 自動復旧しない場合（この issue が数時間開いたまま）
          Cloudflare ダッシュボード → Workers & Pages → boatrace-scrape-trigger →
          1. **Settings → Triggers → Cron Triggers**: 2 件（\`*/5 23,0-13 * * *\` / \`*/30 14-22 * * *\`）が有効か
          2. **Logs / Observability**: scheduled の invocation にエラー、または CPU time が 10ms を超えていないか

          手順の詳細: docs/RUNBOOK.md §8.3
          EOF
          )"
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null 2>&1 && echo "commented on issue #$existing" || echo "::warning::issue comment failed"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
              --title "Worker cron 停止を検知 ($(date -u '+%Y-%m-%d %H:%MZ'))" --body "$body" >/dev/null 2>&1 \
              && echo "opened issue" || echo "::warning::issue create failed"
          fi

          # 復旧しない場合は非ゼロ終了で Actions に可視化。
          echo "::error::Worker still stale after refresh-now (HTTP $status2, reason=${reason:-?}). 対処: $action — docs/RUNBOOK.md §8.3"
          exit 1

      # 2026-11-11: 監視役 (sentinel) 自身の死活確認。
      #   sentinel は自分の cron が走った時刻を 1 時間に 1 回だけ KV に記録する (/status の
      #   sentinel_cron)。記録が 3 時間以上途絶えていれば sentinel の cron が止まっている。
      #   併せて sentinel が記録した「本体 strict health が失敗していた区間」の履歴をログに残す
      #   (本 workflow が走っていない時間帯の障害を後から追えるようにする)。
      - name: Check sentinel liveness (watch the watcher)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          S="https://boatrace-sentinel.inotaka1979.workers.dev/status"
          LABEL="sentinel-down"
          MAX_AGE=10800   # 3 時間 (生存記録の書込間隔 1 時間の 3 倍)

          code=$(curl -sS -m 20 -o /tmp/sentinel.json -w "%{http_code}" "$S" || echo "000")
          echo "sentinel /status: HTTP $code"
          jq '{build, sentinel_cron, main_probe, gh_token, consecutive_failures: .state.consecutive_failures, streak: .state.streak}' \
            /tmp/sentinel.json 2>/dev/null || cat /tmp/sentinel.json 2>/dev/null || true

          echo "--- 本体 strict health の失敗区間 (sentinel 記録、直近 10 件) ---"
          jq -r '(.state.history // [])[] | "\(.started_at) → \(.ended_at)  \(.duration_sec)s failures=\(.failures) reason=\(.reason) hb_age=\(.cron_age_sec)s refresh=\(.refresh|tojson) escalated=\(.escalated) redeploy=\(.redeploy) data=\(.data|tojson)"' \
            /tmp/sentinel.json 2>/dev/null || true
          echo "--- (以上) ---"

          verdict="ok"; detail=""
          if [ "$code" != "200" ]; then
            verdict="down"; detail="/status が HTTP $code"
          elif ! jq -e 'has("sentinel_cron")' /tmp/sentinel.json >/dev/null 2>&1; then
            verdict="unknown"; detail="sentinel が生存記録に未対応の旧バージョン"
          else
            age=$(jq -r '.sentinel_cron.age_sec // ""' /tmp/sentinel.json 2>/dev/null || echo "")
            if [ -z "$age" ]; then
              verdict="stale"; detail="cron tick が一度も記録されていない"
            elif [ "$age" -gt "$MAX_AGE" ]; then
              verdict="stale"; detail="最後の cron tick 記録から ${age} 秒 (閾値 ${MAX_AGE} 秒)"
            fi
          fi
          echo "sentinel verdict: $verdict $detail"

          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")

          if [ "$verdict" = "ok" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                --body "✅ $(date -u '+%Y-%m-%dT%H:%MZ') watchdog: sentinel の cron 記録が復旧しました。自動クローズします。" >/dev/null 2>&1 || true
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
              echo "closed issue #$existing"
            fi
            echo "✅ sentinel is alive"
            exit 0
          fi
          if [ "$verdict" = "unknown" ]; then
            echo "::notice::$detail (次回デプロイで有効になります)"
            exit 0
          fi

          # --- down / stale ---
          last=$(gh run list --workflow deploy-worker.yml --limit 1 --json createdAt --jq '.[0].createdAt' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")
          deploy_age=999999
          if [ -n "$last" ]; then
            deploy_age=$(( $(date +%s) - $(date -d "$last" +%s 2>/dev/null || echo 0) ))
          fi
          if [ "$deploy_age" -lt 1800 ]; then
            # デプロイ直後は cron trigger の反映待ちで未記録になり得る。誤検知を避けて様子見。
            echo "::notice::sentinel: $detail — 直近 30 分以内にデプロイ済み ($last) のため様子見"
            exit 0
          fi
          if [ "$deploy_age" -lt 10800 ]; then
            action="再デプロイ見送り (deploy-worker が 3 時間以内に実行済: $last)"
          elif gh workflow run deploy-worker.yml --ref main --repo "$GITHUB_REPOSITORY"; then
            action="deploy-worker.yml を dispatch (sentinel を再デプロイして cron trigger を再登録)"
          else
            action="deploy-worker.yml の dispatch に失敗 (Actions 権限 / 同時実行を確認)"
          fi

          gh label create "$LABEL" --color b60205 --description "監視 Worker (sentinel) の cron が停止" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          body="$(cat <<EOF
          ## sentinel (監視 Worker) の停止を検知

          - 検知時刻: $(date -u '+%Y-%m-%dT%H:%MZ') UTC
          - 状態: \`$verdict\` — $detail
          - 自動対処: $action

          ### 意味
          本体 Worker (boatrace-scrape-trigger) を 5 分毎に監視する第 2 Worker **boatrace-sentinel** の
          cron が動いていません。本体が正常ならアプリへの影響はありませんが、本体 cron が止まった時の
          検知と予備 cron (refresh-now) が働かなくなります。

          ### 自動復旧しない場合 (この issue が 1 日以上開いたまま)
          Cloudflare ダッシュボード → Workers & Pages → boatrace-sentinel → Settings → Triggers で
          Cron Trigger (\`*/5 * * * *\`) が有効か確認してください。手順: docs/RUNBOOK.md §8.2
          EOF
          )"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null 2>&1 && echo "commented on issue #$existing" || echo "::warning::issue comment failed"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
              --title "sentinel 停止を検知 ($(date -u '+%Y-%m-%d %H:%MZ'))" --body "$body" >/dev/null 2>&1 \
              && echo "opened issue" || echo "::warning::issue create failed"
          fi
          echo "::error::sentinel $verdict: $detail / 対処: $action — docs/RUNBOOK.md §8.2"
          exit 1
