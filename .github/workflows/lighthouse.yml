name: Lighthouse CI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'manifest.json'
      - '.lighthouserc.json'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'manifest.json'
      - '.lighthouserc.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    # ubuntu-latest は 26.04 に移行済み。e2e.yml と同じく、計測環境 (Chrome / フォント) を
    #   従来の 24.04 に揃えて過去スコアと比較できるようにする。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
